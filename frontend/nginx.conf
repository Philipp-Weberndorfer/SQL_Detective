server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API-Aufrufe an das Backend weiterreichen - derselbe Ursprung wie die
    # Seite, damit Sitzungs- und CSRF-Cookie ohne CORS funktionieren.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Single-Page-App: unbekannte Pfade (z. B. /editor) liefern index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
